---
- name: Prepare the existing remote ARM64 host for a private repository runner
  hosts: gpu_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Require one remote Ubuntu 24.04 ARM64 server
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ansible_connection | default('ssh') == 'ssh'
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - ansible_facts['architecture'] == 'aarch64'
        fail_msg: Bootstrap requires one existing remote Ubuntu 24.04 ARM64 server over SSH.
  roles:
    - role: actions_runner
