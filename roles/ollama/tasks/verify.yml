---
- name: Read the installed model metadata
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ollama_port }}/api/tags"
    method: GET
    status_code: 200
    use_proxy: false
    timeout: 10
  register: ollama_installed_model_list

- name: Select the configured model metadata
  ansible.builtin.set_fact:
    ollama_selected_models: >-
      {{ ollama_installed_model_list.json.models
         | selectattr('name', 'equalto', ollama_model) | list }}

- name: Verify the configured model exists
  ansible.builtin.assert:
    that:
      - ollama_selected_models | length == 1
    fail_msg: The configured model was not found after provisioning.

- name: Verify the approved model digest when configured
  ansible.builtin.assert:
    that:
      - ollama_selected_models[0].digest == ollama_model_digest
    fail_msg: >-
      The model digest differs from the approved artifact. Review the model
      update before changing ollama_model_digest; this role never silently
      accepts a different artifact when a digest is configured.
  when: ollama_model_digest | length > 0

- name: Verify the public OpenAI adapter cannot enlarge the model context
  when: public_api_enabled | default(false) | bool
  block:
    - name: Check the public endpoint model and effective context limits
      ansible.builtin.include_tasks: public_limits.yml
  rescue:
    - name: Find the installed public request guard service
      ansible.builtin.service_facts:

    - name: Stop and disable the public request guard after a failed limit check
      ansible.builtin.systemd_service:
        name: llm-api-guard.service
        enabled: false
        state: stopped
      when: "'llm-api-guard.service' in ansible_facts.services"

    - name: Report failed public resource limit acceptance
      ansible.builtin.fail:
        msg: >-
          Public resource limit acceptance failed. The installed public request
          guard has been stopped and disabled. Correct the model and context
          configuration, then rerun the playbook before restoring public access.

- name: Accept configured context concurrency GPU placement and sampled VRAM headroom
  ansible.builtin.command:
    argv:
      - /usr/bin/flock
      - --exclusive
      - --wait
      - "{{ ollama_acceptance_timeout | string }}"
      - /run/ollama/maintenance.lock
      - /usr/bin/python3
      - /usr/local/libexec/gpu_acceptance.py
      - --config
      - "{{ ollama_install_dir }}/acceptance.json"
  async: "{{ ollama_acceptance_timeout | int * 2 + 60 }}"
  poll: 5
  changed_when: false
  register: ollama_capacity_acceptance
