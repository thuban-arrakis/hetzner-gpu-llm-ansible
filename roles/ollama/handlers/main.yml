---
- name: Restart Ollama
  ansible.builtin.systemd_service:
    name: ollama.service
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode

- name: Reload Ollama watchdog timer
  ansible.builtin.systemd_service:
    name: ollama-watchdog.timer
    state: restarted
  when: not ansible_check_mode
