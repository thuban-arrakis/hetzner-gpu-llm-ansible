---
- name: Configure the shared Docker repository
  ansible.builtin.include_role:
    name: docker_engine
    tasks_from: repository

- name: Install NVIDIA's container-toolkit repository signing key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    owner: root
    group: root
    mode: '0644'
    timeout: 30
  register: gpu_host_nvidia_key

- name: Configure NVIDIA's signed stable container-toolkit repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.sources
    content: |
      Types: deb
      URIs: https://nvidia.github.io/libnvidia-container/stable/deb/amd64
      Suites: /
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/nvidia-container-toolkit.asc
    owner: root
    group: root
    mode: '0644'
  register: gpu_host_nvidia_repository

- name: Refresh package metadata after repository changes
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 180
  when: >-
    (docker_engine_key is changed) or (docker_engine_repository is changed) or
    (gpu_host_nvidia_key is changed) or (gpu_host_nvidia_repository is changed)

- name: Install Docker packages using the GPU host settings
  ansible.builtin.include_role:
    name: docker_engine
    tasks_from: packages
  vars:
    docker_engine_version: "{{ gpu_host_docker_version }}"
    docker_engine_restart_handler: Gpu host restart Docker

- name: Install the pinned NVIDIA Container Toolkit packages
  ansible.builtin.apt:
    name:
      - "nvidia-container-toolkit={{ gpu_host_container_toolkit_version }}"
      - "nvidia-container-toolkit-base={{ gpu_host_container_toolkit_version }}"
      - "libnvidia-container-tools={{ gpu_host_container_toolkit_version }}"
      - "libnvidia-container1={{ gpu_host_container_toolkit_version }}"
    state: present
    lock_timeout: 180
  notify: Gpu host restart Docker

- name: Ensure the Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Inspect the NVIDIA runtime configuration before selecting CDI
  ansible.builtin.stat:
    path: /etc/nvidia-container-runtime/config.toml
    follow: false
    checksum_algorithm: sha256
  register: gpu_host_runtime_before

- name: Refuse an unexpected NVIDIA runtime configuration target
  ansible.builtin.assert:
    that:
      - >-
        not gpu_host_runtime_before.stat.exists or
        (gpu_host_runtime_before.stat.isreg and not gpu_host_runtime_before.stat.islnk and
         gpu_host_runtime_before.stat.uid == 0)
    fail_msg: NVIDIA runtime config.toml must be a regular root-owned file, not a symlink.

# The Compose service explicitly selects runtime=nvidia. JIT-CDI modifies the
# OCI device configuration before runc, avoiding the legacy prestart-hook path
# that can lose GPU access after systemd daemon-reload. It needs no cached CDI
# specification, including after driver upgrades or a reboot.
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/cdi-support.html
- name: Select JIT-CDI while preserving other NVIDIA runtime settings
  ansible.builtin.command:
    argv:
      - /usr/bin/nvidia-ctk
      - config
      - --in-place
      - --set
      - nvidia-container-runtime.mode=jit-cdi
  changed_when: false
  when: not ansible_check_mode

- name: Inspect the NVIDIA runtime configuration after selecting CDI
  ansible.builtin.stat:
    path: /etc/nvidia-container-runtime/config.toml
    checksum_algorithm: sha256
  register: gpu_host_runtime_after

- name: Verify that NVIDIA device injection uses JIT-CDI
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import tomllib
        with open('/etc/nvidia-container-runtime/config.toml', 'rb') as config:
            mode = tomllib.load(config).get('nvidia-container-runtime', {}).get('mode')
        if mode != 'jit-cdi':
            raise SystemExit('NVIDIA runtime must use JIT-CDI device injection')
  changed_when: false
  when: not ansible_check_mode

- name: Inspect Docker configuration before runtime registration
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
    follow: false
    checksum_algorithm: sha256
  register: gpu_host_docker_before

- name: Refuse an unexpected Docker daemon configuration target
  ansible.builtin.assert:
    that:
      - >-
        not gpu_host_docker_before.stat.exists or
        (gpu_host_docker_before.stat.isreg and not gpu_host_docker_before.stat.islnk and
         gpu_host_docker_before.stat.uid == 0)
    fail_msg: Docker daemon.json must be a regular root-owned file, not a symlink.

- name: Register the NVIDIA runtime while preserving other daemon settings
  ansible.builtin.command:
    argv:
      - /usr/bin/nvidia-ctk
      - runtime
      - configure
      - --runtime=docker
  changed_when: false
  when: not ansible_check_mode

- name: Inspect Docker configuration after runtime registration
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
    checksum_algorithm: sha256
  register: gpu_host_docker_after

- name: Schedule Docker restart only when runtime configuration changed
  ansible.builtin.debug:
    msg: NVIDIA runtime registration checked without replacing other Docker settings.
  changed_when: >-
    gpu_host_docker_before.stat.checksum | default('') !=
    gpu_host_docker_after.stat.checksum | default('')
  notify: Gpu host restart Docker

- name: Record whether managed GPU containers need recreation
  ansible.builtin.set_fact:
    gpu_host_runtime_configuration_changed: >-
      {{
        gpu_host_runtime_before.stat.checksum | default('') !=
        gpu_host_runtime_after.stat.checksum | default('') or
        gpu_host_docker_before.stat.checksum | default('') !=
        gpu_host_docker_after.stat.checksum | default('')
      }}

- name: Start and verify Docker after NVIDIA runtime registration
  ansible.builtin.include_role:
    name: docker_engine
    tasks_from: start

- name: Inspect registered Docker runtimes
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - info
      - --format
      - "{{ '{{json .Runtimes}}' }}"
  register: gpu_host_registered_runtimes
  changed_when: false
  when: not ansible_check_mode

- name: Require the NVIDIA runtime used by the GPU service
  ansible.builtin.assert:
    that:
      - "'nvidia' in (gpu_host_registered_runtimes.stdout | from_json)"
    fail_msg: Docker did not load the NVIDIA runtime required by the GPU Compose service.
  when: not ansible_check_mode
