---
apiVersion: 1
# Keep alert evaluation and state visible, but send no notifications. Create an
# explicit receiver because disabling initial admin creation also omits the
# default email receiver. Its URL is loopback only, with no external recipient.
# The match-all child is always muted. Root routes cannot have mute timings.
# This dedicated instance's whole notification policy tree is managed here.
contactPoints:
  - orgId: 1
    name: local-ui-only
    receivers:
      - uid: llm-local-ui-only
        type: webhook
        disableResolveMessage: true
        settings:
          # No listener is required: the notification policy prevents delivery.
          # Even an accidental contact-point test cannot contact another host.
          url: http://127.0.0.1:9/notifications-disabled
          httpMethod: POST
          maxAlerts: '1'
muteTimes:
  - orgId: 1
    name: local-ui-only
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '24:00'
        location: UTC
policies:
  - orgId: 1
    receiver: local-ui-only
    group_by:
      - grafana_folder
      - alertname
    routes:
      - receiver: local-ui-only
        mute_time_intervals:
          - local-ui-only
