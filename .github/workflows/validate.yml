---
name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Install controller validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate GitHub Actions syntax and expression contexts
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Install verified Caddy for local TLS gateway tests
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/caddy.tar.gz"
          caddy_sha512='a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab'
          caddy_sha512+='83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7'
          printf '%s  %s\n' "$caddy_sha512" "$RUNNER_TEMP/caddy.tar.gz" | sha512sum --check --status
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
      - name: Validate Ansible and automation contracts
        env:
          CADDY_BINARY: ${{ runner.temp }}/caddy
        run: |
          ansible-playbook -i inventory/example.yml playbooks/deploy.yml --syntax-check
          ansible-playbook -i inventory/example.yml playbooks/bootstrap-runner.yml --syntax-check
          ansible-lint
          docker compose version
          python -m pytest -q
      - name: Validate Terraform without accessing infrastructure
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate
          terraform -chdir=terraform/cloud init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/cloud validate
      - name: Validate bounded request admission and inference policies
        working-directory: roles/public_api/files/api_guard
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOCACHE: ${{ runner.temp }}/guard-go-cache
          GOPATH: ${{ runner.temp }}/guard-go
        run: |
          go version
          go test -race ./...
      - name: Scan source and commit history for secrets
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
